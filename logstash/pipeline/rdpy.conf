input {
  beats {
    port => 5044
  }
}

filter {
  if "rdpy" in [tags] {

    if [src_ip] {

      geoip {
        source   => "src_ip"
        target   => "geoip"
        database => "/geoip/GeoLite2-City.mmdb"
        fields   => [
          "city_name",
          "country_name",
          "country_code2",
          "latitude",
          "longitude",
          "location"
        ]
      }

      geoip {
        source   => "src_ip"
        target   => "asn"
        database => "/geoip/GeoLite2-ASN.mmdb"
        fields   => [
          "autonomous_system_number",
          "autonomous_system_organization"
        ]
      }
    }

    mutate {
      add_field => {
        "honeypot_type" => "rdpy"
        "protocol"      => "RDP"
        "dest_port"     => 3389
      }
    }
  }
}

output {
  if "rdpy" in [tags] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "honeypot-rdpy-%{+YYYY.MM.dd}"
    }
  }
}